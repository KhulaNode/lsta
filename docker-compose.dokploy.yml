services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://lsta.khulanode.com}
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://lsta.khulanode.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-info@lsta.org.za}
    expose:
      - "3000"
    ports:
      - "3000"
    networks:
      - dokploy-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  dokploy-network:
    external: true
